name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar busca por voz e melhorias
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="voice-search.js?v=ux-3"></script>',
              '<script src="confirm-quantity-fix.js?v=2"></script>',
              '<script src="archive-products.js?v=1"></script>',
              '<script src="alterdata-import-v2.js?v=1"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
